name: Windows Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check TypeScript
        run: npm run check

      - name: Build renderer
        run: npm run build

      - name: Prepare release metadata
        run: node scripts/prepare-ci-release.cjs

      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish one complete GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HTTP_TIMEOUT: 60
        run: |
          $manifestPath = 'release/latest.yml'
          $manifest = Get-Content -LiteralPath $manifestPath -Encoding utf8 -Raw
          $safeInstallerName = [regex]::Match($manifest, '(?m)^path:\s*(.+)$').Groups[1].Value.Trim()
          if (-not $safeInstallerName) { throw 'latest.yml does not contain an installer path.' }

          $installer = Get-ChildItem -LiteralPath 'release' -File -Filter '*.exe' | Select-Object -First 1
          $blockMap = Get-ChildItem -LiteralPath 'release' -File -Filter '*.exe.blockmap' | Select-Object -First 1
          if ($null -eq $installer -or $null -eq $blockMap) { throw 'Installer or block map is missing.' }

          $safeInstaller = Join-Path 'release' $safeInstallerName
          $safeBlockMap = "$safeInstaller.blockmap"
          Copy-Item -LiteralPath $installer.FullName -Destination $safeInstaller -Force
          Copy-Item -LiteralPath $blockMap.FullName -Destination $safeBlockMap -Force

          $releaseTags = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json | ForEach-Object { $_.tagName }
          if ($releaseTags -contains $env:GITHUB_REF_NAME) {
            gh release upload $env:GITHUB_REF_NAME $safeInstaller $safeBlockMap $manifestPath --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:GITHUB_REF_NAME $safeInstaller $safeBlockMap $manifestPath --title $env:GITHUB_REF_NAME.TrimStart('v') --generate-notes --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed.' }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccountBook-Windows-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
